<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Remote — Your device, extended</title>
<meta name="description" content="Professional zero-latency LAN remote control for your PC.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23070B16'/><circle cx='32' cy='32' r='18' fill='none' stroke='%2300E5FF' stroke-width='3'/><path d='M27 25v18l5-4 4 8 4-2-4-8h7z' fill='%2300E5FF'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B16;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--cy:#00E5FF;--tx:#EAF0FF;--mu:#8FA3C4}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Inter,Cairo,'Segoe UI',sans-serif;line-height:1.6;overflow-x:hidden}
[dir=rtl] body,[dir=rtl]{font-family:Cairo,Inter,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 80% 10%,rgba(0,229,255,.12),transparent),radial-gradient(500px 400px at 5% 60%,rgba(60,90,255,.10),transparent);pointer-events:none;z-index:-1}
.wrap{max-width:1080px;margin:auto;padding:0 22px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.brand svg{width:34px;height:34px}.brand b{color:var(--cy)}
.lang{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.lang:hover{border-color:var(--cy)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:60px 0 80px}
h1{font-size:clamp(38px,6vw,64px);line-height:1.1;font-weight:800;letter-spacing:-1px}
h1 span{color:var(--cy);text-shadow:0 0 30px rgba(0,229,255,.5)}
.lead{color:var(--mu);font-size:18px;margin:18px 0 30px;max-width:480px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:13px 26px;border-radius:14px;text-decoration:none;font-weight:600;border:1px solid var(--line);color:var(--tx);background:var(--card);transition:.2s}
.btn.p{background:var(--cy);color:#04141A;border-color:var(--cy);box-shadow:0 0 28px rgba(0,229,255,.35)}
.btn:hover{transform:translateY(-2px);border-color:var(--cy)}
.pad{aspect-ratio:1;max-width:380px;width:100%;margin:auto;border-radius:50%;position:relative;display:grid;place-items:center;
background:radial-gradient(circle,rgba(0,229,255,.14),rgba(255,255,255,.02));border:2px solid rgba(0,229,255,.7);
box-shadow:0 0 50px rgba(0,229,255,.35),inset 0 0 50px rgba(0,229,255,.1);transition:transform .15s;animation:pulse 4s ease-in-out infinite}
.pad svg{width:34%;filter:drop-shadow(0 0 14px #00E5FF)}
.pad:before,.pad:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(0,229,255,.25);inset:-18px}
.pad:after{inset:-40px;border-color:rgba(0,229,255,.1)}
@keyframes pulse{50%{box-shadow:0 0 80px rgba(0,229,255,.5),inset 0 0 60px rgba(0,229,255,.16)}}
h2{font-size:clamp(28px,4vw,38px);font-weight:800;text-align:center;margin-bottom:12px}
.sub{text-align:center;color:var(--mu);margin-bottom:40px}
section{padding:50px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;backdrop-filter:blur(10px);transition:.25s}
.card:hover{border-color:rgba(0,229,255,.6);transform:translateY(-4px);box-shadow:0 10px 40px rgba(0,229,255,.1)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);margin-bottom:14px}
.card h3{font-size:18px;margin-bottom:6px}.card p{color:var(--mu);font-size:15px}
.steps{counter-reset:s}
.steps .card:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--cy);color:#04141A;font-weight:800;margin-bottom:14px;box-shadow:0 0 20px rgba(0,229,255,.5)}
.pin{font:700 44px 'JetBrains Mono',Consolas,monospace;letter-spacing:10px;color:var(--cy);text-shadow:0 0 24px rgba(0,229,255,.6);direction:ltr}
.secure{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:36px}
.secure h2{text-align:start}.secure p{color:var(--mu)}
.pinbox{text-align:center}.pinbox small{color:var(--mu)}
footer{border-top:1px solid var(--line);margin-top:50px;padding:30px 0;text-align:center;color:var(--mu);font-size:14px}
@media(max-width:800px){.hero,.secure{grid-template-columns:1fr}.hero{padding-top:30px}.pad{max-width:280px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.trow{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;margin:0 auto 70px;max-width:860px}
.trow.rev{grid-template-columns:1fr auto}.trow.rev .phone{order:2}
.phone{width:250px;padding:9px;border-radius:36px;background:#0d1426;border:1px solid rgba(0,229,255,.35);box-shadow:0 0 60px rgba(0,229,255,.15),0 20px 50px rgba(0,0,0,.5)}
.phone img{display:block;width:100%;border-radius:28px}
.tn{font:700 14px 'JetBrains Mono',Consolas,monospace;color:var(--cy);letter-spacing:2px}
.ttext h3{font-size:28px;margin:6px 0 10px}.ttext p{color:var(--mu);margin-bottom:14px}
.ttext ul{list-style:none;padding:0;display:grid;gap:8px}
.ttext li{padding-inline-start:26px;position:relative;font-size:15px}
.ttext li:before{content:"";position:absolute;inset-inline-start:0;top:9px;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
@media(max-width:800px){.trow,.trow.rev{grid-template-columns:1fr;gap:24px;justify-items:center;text-align:start}.trow.rev .phone{order:0}.phone{width:230px}.ttext{justify-self:stretch}}
.shot{border-radius:16px;overflow:hidden;border:1px solid rgba(0,229,255,.35);box-shadow:0 0 50px rgba(0,229,255,.12),0 16px 40px rgba(0,0,0,.5);background:#0d1426;max-width:380px}
.shot img{display:block;width:100%}
.trow.srv{max-width:980px}.trow.srv.wide{grid-template-columns:1fr;justify-items:center;gap:28px}.trow.wide .shot{max-width:100%;width:100%}
.trow.wide .ttext{max-width:760px}.trow.tall .shot{max-width:290px}
@media(max-width:800px){.trow.srv .shot{max-width:100%}.trow.tall .shot{max-width:260px}}
.note{max-width:760px;margin:0 auto;padding:24px 28px;border-radius:20px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.35)}
.note h3{font-size:18px;margin-bottom:6px}.note p{color:var(--mu);font-size:15px}
nav{position:sticky;top:0;z-index:50;margin:0 -22px;padding:14px 22px;background:rgba(7,11,22,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.links{display:flex;gap:26px}.links a{color:var(--mu);text-decoration:none;font-size:14px;font-weight:600;transition:.2s}.links a:hover{color:var(--cy)}
section{scroll-margin-top:84px;padding:64px 0}
section+section{border-top:1px solid var(--line)}
h2:after{content:"";display:block;width:56px;height:3px;border-radius:2px;background:var(--cy);margin:14px auto 0;box-shadow:0 0 14px var(--cy)}
.secure h2:after{margin-inline-start:0}
.sub{max-width:620px;margin-inline:auto}
@media(max-width:800px){.links{display:none}section{padding:48px 0}}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 15%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 15%,#000 15%,transparent 72%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 26px}.chips span{padding:6px 14px;border-radius:99px;font-size:13px;border:1px solid rgba(0,229,255,.3);background:rgba(0,229,255,.07);color:#9ff3ff}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}.js .rv.in{opacity:1;transform:none}
.player{max-width:900px;margin:auto;border-radius:22px;border:1px solid rgba(0,229,255,.35);background:linear-gradient(180deg,#0d1426,#080d1a);box-shadow:0 0 90px rgba(0,229,255,.14),0 30px 70px rgba(0,0,0,.5);overflow:hidden}
.pbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mu)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#2a3552}
#ptag{padding:3px 12px;border-radius:99px;background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.35);color:var(--cy);font-weight:600}
#pcount{margin-inline-start:auto;font-family:'JetBrains Mono',Consolas,monospace}
.stage{height:440px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(0,229,255,.09),transparent 70%)}
.fig{position:relative;transition:opacity .35s}.fig.out{opacity:0}
.fig img{display:block;width:100%;height:100%;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55);border:1px solid var(--line)}
.hot{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:3px solid var(--cy);box-shadow:0 0 26px var(--cy);opacity:0;pointer-events:none}
.hot:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--cy);animation:ping 1.4s ease-out infinite}
.hot.on{animation:tap 2.4s .6s both}
@keyframes tap{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1)}65%{transform:scale(1)}78%{transform:scale(.72)}100%{opacity:1;transform:scale(1)}}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(2.2);opacity:0}}
.cap{padding:18px 26px 8px;min-height:104px}.cap h3{font-size:21px;margin-bottom:4px}.cap p{color:var(--mu)}
.timeline{direction:ltr;height:6px;margin:8px 26px 0;border-radius:3px;background:#1a2440;cursor:pointer}
.timeline i{display:block;height:100%;width:0;border-radius:3px;background:var(--cy);box-shadow:0 0 12px var(--cy)}
.ctrl{display:flex;align-items:center;gap:8px;padding:14px 26px 22px;flex-wrap:wrap}
.ctrl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer;transition:.2s}
.ctrl button:hover{border-color:var(--cy);color:var(--cy)}
.chapters{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.chapters button{width:32px;height:32px;font-size:13px}.chapters button.on{background:var(--cy);color:#04141A;border-color:var(--cy);box-shadow:0 0 14px rgba(0,229,255,.6)}
@media(max-width:800px){.stage{height:340px}.chapters{margin:0;width:100%}.cap{min-height:128px}}

/* ---- Aurora theme: deep indigo-to-ocean gradient, no black ---- */
:root{--bg:#14226E;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.17);--tx:#F4F7FF;--mu:#BAC8F7;--cy:#2EE9FF}
body{background:linear-gradient(160deg,#1B2A86 0%,#14439A 48%,#0C6FA3 100%) fixed}
body:before{background:radial-gradient(640px 460px at 85% 8%,rgba(139,92,246,.45),transparent),radial-gradient(560px 420px at 4% 42%,rgba(34,211,238,.28),transparent),radial-gradient(520px 380px at 70% 78%,rgba(236,72,153,.20),transparent)}
nav{background:rgba(24,40,120,.55)}
.phone,.shot{background:rgba(10,18,70,.85)}
.player{background:linear-gradient(180deg,rgba(18,32,104,.92),rgba(10,24,86,.92))}
.timeline{background:rgba(255,255,255,.16)}.dots i{background:rgba(255,255,255,.28)}
.btn.p{background:linear-gradient(135deg,#2EE9FF,#8FA8FF);border-color:transparent;box-shadow:0 8px 30px rgba(46,233,255,.35)}
.card:hover{box-shadow:0 12px 40px rgba(10,20,80,.45)}
/* ---- Centered hero, walkthrough straight below ---- */
.hero{display:block;text-align:center;position:relative;padding:46px 0 10px}
.lead{margin-inline:auto;max-width:640px}.btns,.chips{justify-content:center}
.pad{position:absolute;left:0;right:0;top:-30px;margin:auto;width:min(640px,94vw);max-width:none;opacity:.26;z-index:-1}
#watch{padding-top:24px}
.player{max-width:980px}.stage{height:480px}
.cap{min-height:150px}.cap p{font-size:16px;line-height:1.75}
#spd{width:auto!important;border-radius:99px!important;padding:0 12px;font-size:13px!important}
@media(max-width:800px){.stage{height:340px}.cap{min-height:210px}}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="brand">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#00E5FF" stroke-opacity=".3" stroke-width="4"/><circle cx="32" cy="32" r="22" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="85 140" transform="rotate(-125 32 32)"/><path d="M27 22v22l6-5 5 10 5-2-5-10h8z" fill="#00E5FF"/></svg>
    <span>Smart <b>Remote</b></span>
  </div>
  <div class="links">
    <a href="#watch" data-en="Watch" data-ar="شاهد"></a>
    <a href="#features" data-en="Features" data-ar="المميزات"></a>
    <a href="#install" data-en="Download" data-ar="التحميل"></a>
    <a href="#tour" data-en="App tour" data-ar="جولة التطبيق"></a>
    <a href="#server" data-en="Server" data-ar="الخادم"></a>
  </div>
  <button class="lang" id="lang">العربية</button>
</nav>

<header class="hero">
  <div>
    <h1 data-en="Your device, <span>extended.</span>" data-ar="جهازك، <span>بلا حدود.</span>"></h1>
    <p class="lead" data-en="Control your PC from your phone over your local network. Zero latency, total privacy." data-ar="تحكّم بحاسوبك من هاتفك عبر الشبكة المحلية. بلا تأخير وبخصوصية كاملة."></p>
    <div class="chips"><span data-en="Free" data-ar="مجاني"></span><span data-en="Open source" data-ar="مفتوح المصدر"></span><span data-en="Local network only" data-ar="شبكة محلية فقط"></span><span data-en="No account" data-ar="بلا حساب"></span></div>
    <div class="btns">
      <a class="btn p" href="https://github.com/mohamedelmaz/smart-remote-app/releases/download/v1.0.0/smart-remote-app.exe" data-en="Download EXE (Windows)" data-ar="تحميل EXE (ويندوز)"></a>
      <a class="btn" href="https://github.com/mohamedelmaz/smart-remote-app/releases/download/v1.0.0/app-release.apk" data-en="Download APK (Android)" data-ar="تحميل APK (أندرويد)"></a>
    </div>
  </div>
  <div class="pad" id="pad">
    <svg viewBox="0 0 40 52"><path d="M4 2v40l10-9 8 17 9-4-8-16h14z" fill="#00E5FF"/></svg>
  </div>
</header>

<section id="watch">
  <h2 data-en="Watch it, step by step" data-ar="شاهدها خطوة بخطوة"></h2>
  <p class="sub" data-en="An interactive walkthrough from download to first connection. Press play, or click any step." data-ar="شرح تفاعلي من التحميل حتى أول اتصال. شغّل العرض أو اضغط على أي خطوة."></p>
  <div class="player" id="player">
    <div class="pbar"><span class="dots"><i></i><i></i><i></i></span><b id="ptag"></b><span id="pcount"></span></div>
    <div class="stage" id="stage"><div class="fig out" id="fig"><img id="pimg" alt=""><span class="hot" id="hot"></span></div></div>
    <div class="cap"><h3 id="ptitle"></h3><p id="ptext"></p></div>
    <div class="timeline" id="tl"><i id="tlfill"></i></div>
    <div class="ctrl"><button id="prev" aria-label="Previous">&#8249;</button><button id="play" aria-label="Play or pause">&#10074;&#10074;</button><button id="next" aria-label="Next">&#8250;</button><button id="spd" aria-label="Speed">1×</button><div class="chapters" id="chips"></div></div>
  </div>
</section>
<section id="features">
  <h2 data-en="Powerful features" data-ar="مميزات قوية"></h2>
  <p class="sub" data-en="Everything you need to run your PC from the couch." data-ar="كل ما تحتاجه للتحكم بحاسوبك من أي مكان في المنزل."></p>
  <div class="grid">
    <div class="card"><div class="ic">🖱️</div><h3 data-en="Zero-latency touchpad" data-ar="لوحة لمس فورية"></h3><p data-en="Precise cursor control with multi-finger gestures." data-ar="تحكم دقيق بالمؤشر مع إيماءات متعددة الأصابع."></p></div>
    <div class="card"><div class="ic">⌨️</div><h3 data-en="Direct typing" data-ar="كتابة مباشرة"></h3><p data-en="Type naturally with full keyboard support." data-ar="اكتب بشكل طبيعي مع دعم كامل للوحة المفاتيح."></p></div>
    <div class="card"><div class="ic">🖥️</div><h3 data-en="Live screen viewer" data-ar="عرض الشاشة مباشرة"></h3><p data-en="See your PC screen in real time." data-ar="شاهد شاشة حاسوبك لحظة بلحظة."></p></div>
    <div class="card"><div class="ic">🎛️</div><h3 data-en="Macro deck" data-ar="لوحة الاختصارات"></h3><p data-en="Custom shortcut buttons for your favorite actions." data-ar="أزرار اختصار مخصصة لمهامك المفضلة."></p></div>
    <div class="card"><div class="ic">🎙️</div><h3 data-en="Voice control" data-ar="تحكم صوتي"></h3><p data-en="Use your phone's microphone as remote input." data-ar="استخدم ميكروفون هاتفك كمدخل عن بُعد."></p></div>
    <div class="card"><div class="ic">📷</div><h3 data-en="Remote webcam" data-ar="كاميرا عن بُعد"></h3><p data-en="Stream your PC webcam to your phone." data-ar="بثّ كاميرا الحاسوب إلى هاتفك."></p></div>
  </div>
</section>

<section id="start">
  <h2 data-en="Up and running in 3 steps" data-ar="جاهز في 3 خطوات"></h2>
  <p class="sub" data-en="Both devices must be on the same Wi-Fi." data-ar="يجب أن يكون الجهازان على نفس شبكة الواي فاي."></p>
  <div class="grid steps">
    <div class="card"><h3 data-en="Run the server on PC" data-ar="شغّل الخادم على الحاسوب"></h3><p data-en="Download and run the Windows app as administrator." data-ar="حمّل تطبيق ويندوز وشغّله كمسؤول."></p></div>
    <div class="card"><h3 data-en="Install the APK" data-ar="ثبّت تطبيق الهاتف"></h3><p data-en="Install the Android app on your phone." data-ar="ثبّت تطبيق أندرويد على هاتفك."></p></div>
    <div class="card"><h3 data-en="Connect with IP & PIN" data-ar="اتصل بالـ IP والـ PIN"></h3><p data-en="Enter the IP and PIN shown on your PC." data-ar="أدخل عنوان IP ورمز PIN الظاهرين على الحاسوب."></p></div>
  </div>
</section>

<section id="install">

  <div class="note"><h3 data-en="Why does Windows warn me?" data-ar="لماذا يحذّرني ويندوز؟"></h3><p data-en="Smart Remote is a free open-source app (MIT) and is not signed with a paid publisher certificate, so SmartScreen shows this message for any new unsigned app. You can read the full source code on GitHub before running it." data-ar="Smart Remote تطبيق مجاني ومفتوح المصدر (MIT) وغير موقّع بشهادة ناشر مدفوعة، لذلك يعرض SmartScreen هذه الرسالة لأي تطبيق جديد غير موقّع. يمكنك قراءة الكود كاملاً على GitHub قبل التشغيل."></p></div>

><h3 data-en="Install without scanning" data-ar="التثبيت دون فحص"></h3><p data-en="Choose Install without scanning (Installer sans analyser), or Scan app (Analyser l'appli) to let Google check it first." data-ar="اختر Install without scanning (Installer sans analyser)، أو Scan app (Analyser l'appli) ليفحصه Google أولاً."></p><ul><li data-en="Scanning sends the file to Google and needs an internet connection" data-ar="الفحص يرسل الملف إلى Google ويحتاج اتصالاً بالإنترنت"></li><li data-en="After installing, open Smart Remote from your app drawer" data-ar="بعد التثبيت افتح Smart Remote من قائمة التطبيقات"></li></ul></div></div>

  <div class="note"><h3 data-en="Why does Android warn me?" data-ar="لماذا يحذّرني أندرويد؟"></h3><p data-en="The APK is installed directly, not from Google Play, so Play Protect has never seen it. Smart Remote is free and open source (MIT). Download it only from this page or the GitHub releases. Then open the app and enter the PC address and PIN to connect." data-ar="يُثبَّت ملف APK مباشرة وليس من Google Play، لذلك لم يسبق لـ Play Protect أن رآه. Smart Remote مجاني ومفتوح المصدر (MIT). حمّله فقط من هذه الصفحة أو من إصدارات GitHub. ثم افتح التطبيق وأدخل عنوان الحاسوب ورمز PIN للاتصال."></p></div>

  <h2 data-en="How the server works" data-ar="كيف يعمل الخادم"></h2>
  <p class="sub" data-en="A small Windows app that runs in the background and turns your PC into a device you can control from your phone." data-ar="تطبيق ويندوز صغير يعمل في الخلفية ويحوّل حاسوبك إلى جهاز تتحكم به من هاتفك."></p>
  <div class="grid" style="margin-bottom:60px"><div class="card"><h3 data-en="Port 9520" data-ar="المنفذ 9520"></h3><p data-en="The phone connects to your PC's local address on this port. Nothing goes through the internet." data-ar="يتصل الهاتف بعنوان حاسوبك المحلي عبر هذا المنفذ. لا شيء يمر عبر الإنترنت."></p></div><div class="card"><h3 data-en="PIN pairing" data-ar="الاقتران برمز PIN"></h3><p data-en="A PIN pairs your phone. It changes every time you regenerate it." data-ar="رمز PIN يقرن هاتفك بالحاسوب، ويتغير كلما أعدت توليده."></p></div><div class="card"><h3 data-en="Network discovery" data-ar="اكتشاف الشبكة"></h3><p data-en="The server advertises itself with mDNS. You can also choose Manual and type the address." data-ar="يعلن الخادم عن نفسه عبر mDNS. ويمكنك اختيار Manual وكتابة العنوان يدوياً."></p></div><div class="card"><h3 data-en="Self-check" data-ar="فحص ذاتي"></h3><p data-en="Diagnostics tells you if the firewall allows the port and if the network is Private." data-ar="يخبرك التشخيص إن كان الجدار الناري يسمح بالمنفذ وإن كانت الشبكة من نوع Private."></p></div></div>

<script>
const $=s=>document.querySelectorAll(s);
let lang='en';
function apply(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('[data-en]').forEach(e=>e.innerHTML=e.dataset[lang]);
  document.getElementById('lang').textContent=lang==='ar'?'English':'العربية';
  try{localStorage.setItem('lang',lang)}catch(e){}
}
try{lang=localStorage.getItem('lang')||((navigator.language||'').startsWith('ar')?'ar':'en')}catch(e){}
document.getElementById('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';apply()};
apply();
const pad=document.getElementById('pad');
document.addEventListener('mousemove',e=>{
  const x=(e.clientX/innerWidth-.5)*14,y=(e.clientY/innerHeight-.5)*14;
  pad.style.transform=`perspective(700px) rotateY(${x}deg) rotateX(${-y}deg)`;
});
</script>
<script>
(function(){
document.documentElement.classList.add('js');
var D=9500,SP=1,L=function(){return typeof lang!=='undefined'?lang:'en'};
var S=[
['pc','Download the installer','حمّل ملف التثبيت','Open the Smart Remote page on your PC and press Download EXE (Windows). Your browser saves a small file named smart-remote-app.exe in the Downloads folder.','افتح صفحة Smart Remote على حاسوبك واضغط Download EXE (Windows). يحفظ المتصفح ملفاً صغيراً باسم smart-remote-app.exe في مجلد التنزيلات.','Download the installer',50,52],
['pc','Windows warns you','ويندوز يحذّرك','Windows shows a blue warning because the app is new and not yet signed. This is normal for free software. Click the small More info link, not the big button.','يعرض ويندوز نافذة زرقاء لأن التطبيق جديد وغير موقّع بعد، وهذا طبيعي للبرامج المجانية. اضغط على الرابط الصغير More info وليس على الزر الكبير.','Windows SmartScreen warning',23,30],
['pc','Run anyway','شغّله على أي حال','A second button appears. Press Run anyway. The server starts immediately: there is nothing to install and no settings window to fill in.','يظهر زر ثانٍ. اضغط Run anyway. يبدأ الخادم فوراً، ولا يوجد تثبيت ولا نافذة إعدادات لتملأها.','Run anyway',50,92],
['pc','Find it in the tray','ستجده في شريط المهام','Look for the Smart Remote icon near the clock. Click the small arrow if it is hidden. Right-click it to see your PIN and address, or choose Open Dashboard.','ابحث عن أيقونة Smart Remote قرب الساعة، واضغط السهم الصغير إن كانت مخفية. انقر عليها بالزر الأيمن لترى رمز PIN والعنوان، أو اختر Open Dashboard.','Tray menu',42,40],
['ph','Install the APK','ثبّت ملف APK','On your Android phone, download the APK from this page and open it. When Android asks, tap Install. The app needs no special permission to install.','على هاتف أندرويد، حمّل ملف APK من هذه الصفحة وافتحه. عندما يسأل أندرويد اضغط Install. لا يحتاج التطبيق إلى صلاحيات خاصة للتثبيت.','Open the APK and tap Install',85,89],
['ph','Play Protect','Play Protect','Google Play Protect has never seen this app because it is not on the Play Store. The message is a recommendation, not an error. Tap More details to see every option.','لم يسبق لـ Google Play Protect أن رأى هذا التطبيق لأنه غير موجود في متجر Play. الرسالة توصية وليست خطأ. اضغط More details لترى كل الخيارات.','Google Play Protect warning',50,62],
['ph','Install without scanning','التثبيت دون فحص','Choose Install without scanning to finish quickly, or Scan app if you want Google to check it first (this needs internet). Then open Smart Remote from your apps.','اختر Install without scanning لتنتهي بسرعة، أو Scan app إن أردت أن يفحصه Google أولاً (يحتاج إنترنت). ثم افتح Smart Remote من قائمة التطبيقات.','Install without scanning',50,67],
['go','Connect with IP and PIN','اتصل بالـ IP والـ PIN','Make sure the phone and the PC are on the same Wi-Fi. In the app choose Manual, type the address and the PIN shown on your PC, and you are connected.','تأكد أن الهاتف والحاسوب على نفس الواي فاي. في التطبيق اختر Manual، واكتب العنوان ورمز PIN الظاهرين على حاسوبك، وستتصل.','Web dashboard',27,38]];
var TAG={pc:['PC · Windows','الحاسوب · ويندوز'],ph:['Phone · Android','الهاتف · أندرويد'],go:['Connect','الاتصال']};
var $=function(i){return document.getElementById(i)};
var st=$('stage'),fig=$('fig'),img=$('pimg'),hot=$('hot'),chips=$('chips'),fill=$('tlfill');
var src=S.map(function(s){var e=document.querySelector('.shot img[alt="'+s[5]+'"],.phone img[alt="'+s[5]+'"]');return e?e.src:''});
var i=0,el=0,playing=false,user=true,last=0;
S.forEach(function(s,k){var b=document.createElement('button');b.textContent=k+1;b.onclick=function(){go(k)};chips.appendChild(b)});
function fit(){var r=img.naturalWidth/img.naturalHeight||1,W=st.clientWidth-28,H=st.clientHeight-28,w=Math.min(W,H*r);fig.style.width=w+'px';fig.style.height=w/r+'px'}
function render(){var s=S[i],a=L()==='ar'?1:0;
 fig.classList.add('out');img.alt=s[5];img.src=src[i];
 $('ptitle').textContent=a?s[2]:s[1];$('ptext').textContent=a?s[4]:s[3];
 $('ptag').textContent=TAG[s[0]][a];$('pcount').textContent=(i+1)+' / '+S.length;
 Array.prototype.forEach.call(chips.children,function(b,k){b.classList.toggle('on',k===i)});
 hot.classList.remove('on');hot.style.left=s[6]+'%';hot.style.top=s[7]+'%';
 setTimeout(function(){fit();fig.classList.remove('out');void hot.offsetWidth;hot.classList.add('on')},120)}
function go(k){i=(k+S.length)%S.length;el=0;render()}
img.onload=fit;window.addEventListener('resize',fit);
function tick(t){var dt=last?t-last:0;last=t;
 if(playing){el+=dt*SP;if(el>=D){if(i===S.length-1){playing=false;user=false;$('play').innerHTML='&#9654;';el=D}else go(i+1)}}
 fill.style.width=((i+Math.min(el/D,1))/S.length*100)+'%';requestAnimationFrame(tick)}
$('play').onclick=function(){if(!playing&&i===S.length-1&&el>=D)go(0);user=!playing?true:false;playing=!playing;$('play').innerHTML=playing?'&#10074;&#10074;':'&#9654;'};
$('prev').onclick=function(){go(i-1)};$('next').onclick=function(){go(i+1)};
$('tl').onclick=function(e){var r=this.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;go(Math.min(S.length-1,Math.floor(f*S.length)))};
$('spd').onclick=function(){var v=[0.7,1,1.5],k=(v.indexOf(SP)+1)%3;SP=v[k];this.textContent=SP+'×'};
var oa=window.apply;window.apply=function(){oa();render()};
render();requestAnimationFrame(tick);
if('IntersectionObserver' in window){
 new IntersectionObserver(function(e){var v=e[0].isIntersecting;if(v&&user&&!playing){playing=true;$('play').innerHTML='&#10074;&#10074;'}else if(!v&&playing){playing=false;$('play').innerHTML='&#9654;'}},{threshold:.5}).observe($('player'));
 var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){var t=x.target;t.classList.add('in');io.unobserve(t);setTimeout(function(){t.classList.remove('rv','in')},900)}})},{threshold:.12});
 document.querySelectorAll('.card,.trow,.secure,.note').forEach(function(n){n.classList.add('rv');io.observe(n)});
}
})();
