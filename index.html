/* ---- Aurora theme: deep indigo-to-ocean gradient, no black ---- */
:root{--bg:#14226E;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.17);--tx:#F4F7FF;--mu:#BAC8F7;--cy:#2EE9FF}

/* ======== Level-up: motion, bento, devices, marquee ======== */
::selection{background:#2EE9FF;color:#04141A}
html{scrollbar-color:#5b6fd6 transparent}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;animation:drift 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-18vmax;top:-14vmax;background:radial-gradient(circle,rgba(139,92,246,.5),transparent 62%)}

@keyframes up{from{opacity:0;transform:translateY(28px)}}

h1{font-size:clamp(44px,7.4vw,82px);letter-spacing:-2px}

@keyframes flow{to{background-position:300% 0}}
.lead{font-size:19px}

/* fanned phones */
.devices{position:relative;display:flex;justify-content:center;align-items:flex-start;margin:52px auto 0;max-height:min(440px,95vw);overflow:hidden;animation:up 1.1s .45s both;--px:0;--py:0;

.marq{direction:ltr;overflow:hidden;margin:20px -22px 0;padding:16px 0;border-block:1px solid var(--line);background:rgba(255,255,255,.05);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}

.mtrack span:nth-child(odd){color:rgba(46,233,255,.9)}
.mtrack span:after{content:"\2726";margin-inline-start:44px;color:rgba(255,255,255,.28)}
@keyframes marq{to{transform:translateX(-50%)}}
#watch{padding-top:70px}
/* stats */
#stats{padding:30px 0 10px;border-top:0}

#features .grid{grid-template-columns:repeat(6,1fr);gap:18px}

#features .card:nth-child(1){grid-column:span 4}#features .card:nth-child(2){grid-column:span 2}
#features .card:nth-child(3){grid-column:span 2}#features .card:nth-child(4){grid-column:span 4}
#features .card:nth-child(5),#features .card:nth-child(6){grid-column:span 3}
#features .card:nth-child(1),#features .card:nth-child(4){background:linear-gradient(135deg,rgba(46,233,255,.12),rgba(167,139,250,.12))}
/* spotlight */
.card{position:relative;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.15),transparent 65%)}
.card:hover:after{opacity:1}
/* closing CTA panel */
#cta{margin:40px 0;padding:76px 20px;border:1px solid rgba(255,255,255,.22);border-radius:34px;background:linear-gradient(135deg,rgba(46,233,255,.16),rgba(167,139,250,.2),rgba(244,114,182,.14));box-shadow:0 30px 80px rgba(6,12,70,.4)}
/* footer + back to top */
footer{text-align:start;padding:50px 0 28px;border-top:1px solid var(--line);margin-top:30px}
.fgrid{display:flex;justify-content:space-between;gap:30px;align-items:flex-start;flex-wrap:wrap;padding-bottom:26px}
.fl{display:flex;gap:24px;flex-wrap:wrap}.fl a{color:var(--mu);text-decoration:none;font-weight:600}.fl a:hover{color:var(--cy)}
.fcopy{border-top:1px solid var(--line);padding-top:18px;text-align:center}
#top{position:fixed;inset-inline-end:22px;bottom:22px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(20,32,108,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:.3s;z-index:70}
#top.show{opacity:1;pointer-events:auto}#top:hover{border-color:var(--cy);color:var(--cy)}
@media(max-width:800px){#features .grid{grid-template-columns:1fr}#features .card{grid-column:auto!important}.stats{grid-template-columns:repeat(2,1fr)}.dv.l{margin-inline-end:-18px}.dv.r{margin-inline-start:-18px}#cta{padding:56px 16px}}

/* ======== Hook line, use cases, consent modal ======== */
.hook{min-height:36px;margin:-6px 0 18px;font-size:clamp(18px,2.8vw,26px);font-weight:700;color:#fff}
.hook:after{content:"";display:inline-block;width:3px;height:1.1em;margin-inline-start:5px;vertical-align:-4px;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.fine{margin-top:16px;font-size:13px;color:var(--mu)}
.ucg{grid-template-columns:repeat(6,1fr);gap:18px}
.ucg .card{grid-column:span 2;padding:26px}.ucg .card:nth-child(-n+2){grid-column:span 3}
.ucg .card h3{font-size:21px;margin-bottom:8px}
.sc{position:relative;height:150px;margin-bottom:20px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(46,233,255,.18),rgba(10,16,64,.75));border:1px solid var(--line)}
.live{position:absolute;top:10px;inset-inline-end:12px;font-style:normal;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:99px;background:rgba(255,64,100,.18);color:#ff9bb0;border:1px solid rgba(255,64,100,.5)}
.live:before{content:"";display:inline-block;width:7px;height:7px;margin-inline-end:6px;border-radius:50%;background:#ff4064;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.mon{position:relative;width:62%;height:98px;padding:10px;border-radius:10px;border:3px solid #cfd8ff;background:#0a1040}
.mon b{display:block;height:6px;margin:9px 0;border-radius:3px;background:rgba(255,255,255,.25)}.mon b:nth-of-type(2){width:70%}.mon b:nth-of-type(3){width:45%}
.tb{display:block;height:5px;width:32%;border-radius:3px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.cur,.cur2{position:absolute;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:15px solid #fff;transform:rotate(-20deg);filter:drop-shadow(0 0 6px rgba(46,233,255,.9))}
.cur{animation:cm1 5s ease-in-out infinite}
@keyframes cm1{0%,100%{left:10%;top:28%}30%{left:62%;top:34%}60%{left:44%;top:66%}}
.vf{position:relative;width:132px;height:106px;border-radius:12px;overflow:hidden;background:#0a1040;border:2px solid rgba(46,233,255,.6)}
.hd{position:absolute;left:50%;top:22px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:rgba(255,255,255,.4)}
.bd{position:absolute;left:50%;top:60px;width:72px;height:62px;margin-left:-36px;border-radius:36px 36px 0 0;background:rgba(255,255,255,.3)}
.scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 12px var(--cy);animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%,100%{top:6%}50%{top:92%}}
.sh{width:76px;fill:rgba(46,233,255,.15);stroke:var(--cy);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 12px rgba(46,233,255,.6))}
.sh path:last-child{fill:none;stroke:#fff}
.ring{position:absolute;width:92px;height:92px;border-radius:50%;border:2px solid var(--cy);animation:ringp 2.6s ease-out infinite}
@keyframes ringp{from{transform:scale(.7);opacity:.8}to{transform:scale(1.9);opacity:0}}
.ph{position:relative;width:54px;height:98px;margin-inline-end:36px;border-radius:12px;border:3px solid #cfd8ff;background:#0a1040}
.fg{position:absolute;width:16px;height:16px;border-radius:50%;background:rgba(46,233,255,.85);box-shadow:0 0 14px var(--cy);animation:fg 4s ease-in-out infinite}
@keyframes fg{0%,100%{left:8px;top:14px}40%{left:24px;top:24px}70%{left:14px;top:64px}}
.mon2{position:relative;width:92px;height:64px;border-radius:8px;border:3px solid #cfd8ff;background:#0a1040}
.cur2{animation:cm2 4s ease-in-out infinite}
@keyframes cm2{0%,100%{left:10px;top:10px}40%{left:52px;top:20px}70%{left:30px;top:40px}}
.tf{width:82%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);font:15px 'JetBrains Mono',Consolas,monospace;color:#fff}
.tx{display:inline-block;max-width:19ch;overflow:hidden;white-space:nowrap;vertical-align:bottom;border-inline-end:2px solid var(--cy);width:0;animation:typing 4.5s steps(19) infinite}
@keyframes typing{0%{width:0}65%,100%{width:19ch}}
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(6,10,50,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal.open{display:grid}
.mbox{width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:30px;border-radius:26px;background:linear-gradient(180deg,rgba(30,46,146,.97),rgba(14,28,100,.97));border:1px solid rgba(255,255,255,.26);box-shadow:0 40px 100px rgba(0,0,0,.55);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.mbox h3{font-size:26px;margin-bottom:10px}.mbox>p{color:var(--mu);margin-bottom:14px}
.mbox ul{list-style:none;padding:0;display:grid;gap:10px;margin-bottom:18px}
.mbox li{position:relative;padding-inline-start:28px;font-size:15px;line-height:1.7}
.mbox li:before{content:"";position:absolute;inset-inline-start:0;top:8px;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
.ok{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-weight:600}
.ok input{width:20px;height:20px;margin-top:2px;accent-color:#2EE9FF;flex:none}
.mact{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.mact .btn{font:inherit;font-weight:700;cursor:pointer}.mact .btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none;box-shadow:none}
@media(max-width:800px){.ucg{grid-template-columns:1fr}.ucg .card,.ucg .card:nth-child(-n+2){grid-column:auto}}

/* logo polish (merged over live v1.0.0 SVG/toast version: user edits intentionally kept) */
.logo-img{display:block;object-fit:contain;border-radius:22%;filter:drop-shadow(0 0 10px rgba(46,233,255,.45))}
nav .logo-img{width:34px;height:34px}
footer .brand .logo-img{width:42px;height:42px}
.logo-hero{width:min(200px,52vw);height:auto;border-radius:24px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 18px 50px rgba(46,233,255,.28),0 0 90px rgba(139,92,246,.35);animation:logofloat 6s ease-in-out infinite}
@keyframes logofloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.logo-hero{animation:none}}
footer .brand{font-size:22px}
footer p{color:var(--mu);line-height:1.6}
footer .fl a{transition:color .2s,transform .2s}footer .fl a:hover{color:var(--cy);transform:translateY(-1px)}
.fcopy{opacity:.7;font-size:13px;padding-top:22px}
</style>
</head>

  <p class="sub" data-en="Five things you can do the moment your phone is connected." data-ar="خمسة أشياء تفعلها بمجرد أن يتصل هاتفك."></p>
  <div class="grid ucg"><div class="card"><div class="sc s1"><div class="mon"><i class="tb"></i><b></b><b></b><b></b><u class="cur"></u></div><em class="live">LIVE</em></div><h3 data-en="Watch your screen, from anywhere in the house" data-ar="شاهد شاشة حاسوبك من أي مكان في البيت"></h3><p data-en="See exactly what is on your PC in real time. Check a download, a render or a presentation without getting up." data-ar="شاهد ما يظهر على حاسوبك لحظة بلحظة. تابع تحميلاً أو معالجة فيديو أو عرضاً تقديمياً دون أن تقوم من مكانك."></p></div><div class="card"><div class="sc s2"><div class="vf"><span class="hd"></span><span class="bd"></span><i class="scan"></i></div><em class="live">LIVE</em></div><h3 data-en="Open the camera. See who is at your PC." data-ar="افتح الكاميرا واعرف من يستعمل حاسوبك"></h3><p data-en="Turn the PC webcam into a live view on your phone, and know who is in front of your computer while you are at home." data-ar="حوّل كاميرا الحاسوب إلى بث مباشر على هاتفك، واعرف من يجلس أمام جهازك وأنت في البيت."></p></div><div class="card"><div class="sc s3"><span class="ring"></span><svg viewBox="0 0 64 64" class="sh"><path d="M32 6l20 8v16c0 14-9 24-20 28C21 54 12 44 12 30V14z"/><path d="M23 32l7 7 12-14"/></svg></div><h3 data-en="Keep an eye on the family computer" data-ar="راقب سلامة أطفالك على الحاسوب العائلي"></h3><p data-en="Check what is on the family PC and help keep your children safe online. Be open with them: Smart Remote shows an icon in the Windows tray while it runs." data-ar="تحقق مما يظهر على الحاسوب العائلي وساعد في حماية أطفالك على الإنترنت. كن صريحاً معهم: يعرض Smart Remote أيقونة في شريط مهام ويندوز أثناء عمله."></p></div><div class="card"><div class="sc s4"><div class="ph"><u class="fg"></u></div><div class="mon2"><u class="cur2"></u></div></div><h3 data-en="Control your PC from the couch" data-ar="تحكّم بجهازك وأنت جالس على الأريكة"></h3><p data-en="Your phone becomes a trackpad, a media remote and a shortcut deck. Pause the movie, change the volume, lock the PC." data-ar="يتحول هاتفك إلى لوحة لمس وريموت وسائط ولوحة اختصارات. أوقف الفيلم، وغيّر الصوت، واقفل الجهاز."></p></div><div class="card"><div class="sc s5"><div class="tf"><span class="tx" data-en="Hello from my phone" data-ar="مرحباً من هاتفي"></span></div></div><h3 data-en="Type and control with ease" data-ar="اكتب وتحكّم بكل سهولة"></h3><p data-en="Use the on-screen keyboard or your phone keyboard, with Ctrl, Alt and the arrow keys one tap away." data-ar="استخدم لوحة المفاتيح داخل التطبيق أو لوحة هاتفك، مع Ctrl وAlt والأسهم بلمسة واحدة."></p></div></div>

<section id="start">
  <h2 data-en="Up and running in 3 steps" data-ar="جاهز في 3 خطوات"></h2>
  <p class="sub" data-en="Both devices must be on the same Wi-Fi." data-ar="يجب أن يكون الجهازان على نفس شبكة الواي فاي."></p>

  <div class="note"><h3 data-en="Why does Windows warn me?" data-ar="لماذا يحذّرني ويندوز؟"></h3><p data-en="Smart Remote is a free open-source app (MIT) and is not signed with a paid publisher certificate, so SmartScreen shows this message for any new unsigned app. You can read the full source code on GitHub before running it." data-ar="Smart Remote تطبيق مجاني ومفتوح المصدر (MIT) وغير موقّع بشهادة ناشر مدفوعة، لذلك يعرض SmartScreen هذه الرسالة لأي تطبيق جديد غير موقّع. يمكنك قراءة الكود كاملاً على GitHub قبل التشغيل."></p></div>

  <div class="note"><h3 data-en="Why does Android warn me?" data-ar="لماذا يحذّرني أندرويد؟"></h3><p data-en="The APK is installed directly, not from Google Play, so Play Protect has never seen it. Smart Remote is free and open source (MIT). Download it only from this page or the GitHub releases. Then open the app and enter the PC address and PIN to connect." data-ar="يُثبَّت ملف APK مباشرة وليس من Google Play، لذلك لم يسبق لـ Play Protect أن رآه. Smart Remote مجاني ومفتوح المصدر (MIT). حمّله فقط من هذه الصفحة أو من إصدارات GitHub. ثم افتح التطبيق وأدخل عنوان الحاسوب ورمز PIN للاتصال."></p></div>

<section id="server">
  <h2 data-en="How the server works" data-ar="كيف يعمل الخادم"></h2>
  <p class="sub" data-en="A small Windows app that runs in the background and turns your PC into a device you can control from your phone." data-ar="تطبيق ويندوز صغير يعمل في الخلفية ويحوّل حاسوبك إلى جهاز تتحكم به من هاتفك."></p>
  <div class="grid" style="margin-bottom:60px"><div class="card"><h3 data-en="Port 9520" data-ar="المنفذ 9520"></h3><p data-en="The phone connects to your PC's local address on this port. Control traffic stays on your local network." data-ar="يتصل الهاتف بعنوان حاسوبك المحلي عبر هذا المنفذ. يبقى مرور التحكم داخل شبكتك المحلية."></p></div><div class="card"><h3 data-en="PIN pairing" data-ar="الاقتران برمز PIN"></h3><p data-en="A PIN pairs your phone. It changes every time you regenerate it." data-ar="رمز PIN يقرن هاتفك بالحاسوب، ويتغير كلما أعدت توليده."></p></div><div class="card"><h3 data-en="Network discovery" data-ar="اكتشاف الشبكة"></h3><p data-en="The server advertises itself with mDNS. You can also choose Manual and type the address." data-ar="يعلن الخادم عن نفسه عبر mDNS. ويمكنك اختيار Manual وكتابة العنوان يدوياً."></p></div><div class="card"><h3 data-en="Self-check" data-ar="فحص ذاتي"></h3><p data-en="Diagnostics tells you if the firewall allows the port and if the network is Private." data-ar="يخبرك التشخيص إن كان الجدار الناري يسمح بالمنفذ وإن كانت الشبكة من نوع Private."></p></div></div>

<section id="privacy">
  <div class="secure">
    <div>
      <h2 data-en="Local by design" data-ar="محلي بالتصميم"></h2>
      <p data-en="Smart Remote works only on your local network: control traffic and screen content stay on your LAN and never leave it. The only outside request is the fonts, which are downloaded from Google when the page or the app loads. Pairing uses a PIN. Use it on networks you trust, such as your home Wi-Fi, and avoid public Wi-Fi." data-ar="يعمل Smart Remote على شبكتك المحلية فقط: يبقى مرور التحكم ومحتوى الشاشة داخل شبكتك ولا يغادرها. الطلب الخارجي الوحيد هو الخطوط، تُنزَّل من Google عند تحميل الصفحة أو التطبيق. الاقتران برمز PIN. استخدمه على شبكات تثق بها مثل واي فاي المنزل، وتجنّب الشبكات العامة."></p>
    </div>
    <div class="pinbox"><div class="pin">739 519</div><small data-en="Pairing PIN (example)" data-ar="رمز الاقتران (مثال)"></small></div>
  </div>
</section>

<section id="faq">
  <h2 data-en="Questions, answered" data-ar="أسئلة وأجوبة"></h2>
  <p class="sub" data-en="The most common stumbling blocks, in one place." data-ar="أكثر العقبات شيوعاً في مكان واحد."></p>
  <div class="faq"><details><summary data-en="Is it safe?" data-ar="هل هو آمن؟"></summary><p data-en="Control traffic and screen content stay on your local network; the only outside request is the fonts, downloaded from Google when the page or the app loads. Pairing needs a PIN. The connection on your network is not encrypted yet, so use it only on networks you trust, never on public Wi-Fi. The source code is open (MIT), so you can read it yourself." data-ar="يبقى مرور التحكم ومحتوى الشاشة داخل شبكتك المحلية؛ الطلب الخارجي الوحيد هو الخطوط، تُنزَّل من Google عند تحميل الصفحة أو التطبيق. الاقتران يحتاج إلى رمز PIN. الاتصال داخل شبكتك غير مشفّر حالياً، لذا استخدمه على شبكات تثق بها فقط، وليس على الواي فاي العام. والكود مفتوح المصدر (MIT) فيمكنك قراءته بنفسك."></p></details><details><summary data-en="My phone cannot connect. What should I check?" data-ar="هاتفي لا يتصل. ماذا أفحص؟"></summary><p data-en="• Phone and PC are on the same Wi-Fi (not a guest network)<br>• The PC network profile is Private<br>• The Windows firewall allows port 9520 (see Diagnostics in the dashboard)<br>• The IP and PIN are correct: copy them from the tray menu<br>• No VPN is running on either device<br>• Try New PIN and connect again" data-ar="• الهاتف والحاسوب على نفس الواي فاي (وليس شبكة ضيوف)<br>• نوع شبكة الحاسوب Private<br>• الجدار الناري يسمح بالمنفذ 9520 (انظر التشخيص في لوحة التحكم)<br>• عنوان IP ورمز PIN صحيحان: انسخهما من قائمة الأيقونة<br>• لا يوجد VPN يعمل على أي من الجهازين<br>• جرّب New PIN ثم اتصل من جديد"></p></details><details><summary data-en="Why does Windows say it protected my PC?" data-ar="لماذا يقول ويندوز إنه حمى جهازي؟"></summary><p data-en="SmartScreen warns about any new app that is not signed with a paid certificate. Click More info, then Run anyway." data-ar="يحذّر SmartScreen من أي تطبيق جديد غير موقّع بشهادة مدفوعة. اضغط More info ثم Run anyway."></p></details><details><summary data-en="Why does Android show a Play Protect warning?" data-ar="لماذا يعرض أندرويد تحذير Play Protect؟"></summary><p data-en="The APK is installed directly and is not on Google Play. Choose Install without scanning, or scan the app with Google first." data-ar="يُثبَّت ملف APK مباشرة وهو غير موجود في Google Play. اختر Install without scanning، أو افحص التطبيق عبر Google أولاً."></p></details><details><summary data-en="Does it work over the internet?" data-ar="هل يعمل عبر الإنترنت؟"></summary><p data-en="No. It is designed for the local network only, so both devices must share the same network. That is also what keeps it fast and private." data-ar="لا. صُمّم للشبكة المحلية فقط، لذا يجب أن يكون الجهازان على الشبكة نفسها. وهذا ما يجعله سريعاً وخاصاً."></p></details><details><summary data-en="How do I change the PIN or stop the server?" data-ar="كيف أغيّر الـ PIN أو أوقف الخادم؟"></summary><p data-en="Right-click the tray icon. New PIN generates a fresh code, Start with Windows toggles auto-start, and Quit stops the server." data-ar="انقر بالزر الأيمن على أيقونة شريط المهام. New PIN يولّد رمزاً جديداً، وStart with Windows يفعّل التشغيل التلقائي أو يعطّله، وQuit يوقف الخادم."></p></details><details><summary data-en="Is it free?" data-ar="هل هو مجاني؟"></summary><p data-en="Yes. Smart Remote is free and open source under the MIT license." data-ar="نعم. Smart Remote مجاني ومفتوح المصدر برخصة MIT."></p></details></div>
