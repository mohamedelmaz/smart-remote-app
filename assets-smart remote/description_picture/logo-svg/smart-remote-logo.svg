<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A33"/>
      <stop offset="1" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF3FF"/>
      <stop offset="1" stop-color="#00C8FF"/>
    </linearGradient>
    <radialGradient id="glass" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.02"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#070B16"/>

  <!-- App icon -->
  <rect x="30" y="30" width="340" height="340" rx="80" fill="url(#bg)" stroke="#1B2A4A" stroke-width="2"/>
  <circle cx="200" cy="200" r="118" fill="url(#glass)"/>
  <!-- touchpad ring: dim base + bright active arc -->
  <circle cx="200" cy="200" r="118" fill="none" stroke="#00E5FF" stroke-opacity="0.28" stroke-width="8"/>
  <circle cx="200" cy="200" r="118" fill="none" stroke="url(#cy)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="330 412" transform="rotate(-125 200 200)" filter="url(#glow)"/>
  <!-- touch ripple -->
  <circle cx="176" cy="156" r="34" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="176" cy="156" r="52" fill="none" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="3"/>
  <!-- cursor -->
  <path d="M176 156 L176 262 L202 238 L222 280 L244 270 L224 229 L258 229 Z"
        fill="url(#cy)" stroke="#050812" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="420" y="215" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="108" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Smart <tspan fill="#00E5FF">Remote</tspan></text>
  <text x="424" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#8FA3C4" letter-spacing="6">YOUR DEVICE, EXTENDED</text>
  <rect x="424" y="305" width="120" height="5" rx="2.5" fill="#00E5FF" opacity="0.8"/>
</svg>
